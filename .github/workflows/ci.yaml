name: Identity foundation checks
on:
  push:
  pull_request:
permissions:
  contents: read

jobs:
  offline-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install audited token-verification dependency
        run: python -m pip install --disable-pip-version-check -r requirements-auth.txt
      - name: Check authorization, configuration and OIDC validation
        run: python3 -m unittest discover -s tests -v
      - name: Validate development configuration
        run: python3 scripts/check_config.py

  isolated-runtime-smoke:
    needs: offline-checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install OIDC verification dependency
        run: python3 -m pip install --disable-pip-version-check -r requirements-auth.txt
      - name: Generate isolated ephemeral secrets
        run: python3 scripts/init_env.py
      - name: Validate private Docker Compose configuration
        run: |
          python3 scripts/check_config.py
          docker compose config --quiet
          python3 - <<'PY'
          import json
          import subprocess
          data = json.loads(subprocess.check_output(
              ["docker", "compose", "config", "--format", "json"], text=True))
          identity = data["services"]["identity"]
          assert identity["ports"][0]["host_ip"] == "127.0.0.1"
          assert str(identity["ports"][0]["published"]) == "8080"
          assert not data["services"]["db"].get("ports")
          print("PASS: only Keycloak loopback port is published")
          PY
      - name: Prepare CI-only synthetic OIDC client and user
        run: python3 scripts/prepare_ci_login_fixture.py
      - name: Start disposable local identity engine
        run: docker compose up -d
      - name: Verify OIDC metadata and public JWKS
        run: |
          python3 scripts/smoke_oidc.py
          python3 scripts/smoke_oidc_client.py
      - name: Verify real synthetic browser form, code exchange and ID token
        run: python3 scripts/smoke_login.py
      - name: Restart identity container and verify realm continuity
        run: |
          docker compose restart identity
          python3 scripts/smoke_oidc.py
      - name: Verify disposable database backup and restore
        run: python3 scripts/smoke_backup_restore.py
      - name: Stop isolated test services
        if: always()
        run: docker compose down --remove-orphans
      - name: Remove synthetic ephemeral user credentials from CI runner
        if: always()
        run: |
          rm -f /tmp/goreecloud-identity-ci-login.json
          git restore -- realm/goreecloud-realm.json
