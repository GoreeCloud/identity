name: Identity foundation checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check policy engine and secret bootstrap
        run: python3 -m unittest discover -s tests -v
      - name: Validate development configuration
        run: python3 scripts/check_config.py
